<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castaway Economy</title>
<style>
:root{--bg:#0f2430;--surface:#17394a;--surface2:#1f4a5f;--line:#2c6179;--text:#f3f7f9;--muted:#a9c3cf;--good:#7ee0a0;--bad:#ff9b8a;--warn:#ffd166;--accent:#4fc3f7;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
main{max-width:640px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:1.15rem} h3{font-size:1rem}
.card{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;color:#10202a;font-weight:800}
.top .name{font-size:1.5rem}
.top .sub{font-size:.85rem;font-weight:700;opacity:.85}
.pts{font-size:1.6rem;text-align:right;line-height:1}
.pts small{display:block;font-size:.7rem;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{background:var(--bg);border-radius:10px;text-align:center;padding:8px 2px}
.chip b{display:block;font-size:1.5rem;line-height:1.1}
.chip span{font-size:.72rem;color:var(--muted)}
.chip.short{outline:2px solid var(--bad)}
.chip.ok{outline:2px solid transparent}
.need{font-size:.72rem;display:block}
.need.bad{color:var(--bad);font-weight:700} .need.good{color:var(--good)}
button,select{font:inherit}
button{background:var(--accent);color:#06222e;border:0;border-radius:10px;padding:11px 14px;font-weight:800;min-height:44px;cursor:pointer}
button.sec{background:var(--surface2);color:var(--text)}
button.bad{background:#7a3b34;color:#fff}
button:disabled{opacity:.4;cursor:default}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.timer{font-size:2.6rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--bad)}
.banner{border-radius:12px;padding:10px 12px;font-weight:700;text-align:center}
.banner.warn{background:#4a3a12;color:var(--warn)}
.banner.bad{background:#4d2520;color:var(--bad)}
.banner.good{background:#173d2a;color:var(--good)}
.step{display:flex;align-items:center;gap:6px}
.stepper{display:flex;gap:6px}
.stepper button{width:44px;padding:0}
.stepper .q{min-width:34px;text-align:center;font-weight:900;font-size:1.2rem}
.side{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.side legend{font-weight:800;padding:0 6px}
fieldset{margin:0;padding:0;border:0;min-width:0}
.offer{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.offer.incoming{outline:2px solid var(--warn)}
.tag{font-size:.75rem;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--surface2)}
.tag.done{background:#173d2a;color:var(--good)} .tag.bad{background:#4d2520;color:var(--bad)}
.err{color:var(--bad);font-weight:700;min-height:1.2em}
.islands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.islandbtn{background:var(--surface);color:var(--text);border-left:8px solid var(--c);text-align:left}
.proj{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px}
.proj .t{font-weight:800}
table{width:100%;border-collapse:collapse} td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)} td.n,th.n{text-align:right}
.toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:616px;margin:0 auto;background:#fff;color:#12202a;border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 6px 20px #0008;z-index:5}
.deal{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font-size:.95rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
input[type=text]{font:inherit;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:1.6rem;text-transform:uppercase;letter-spacing:.3em;text-align:center;width:100%}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
'use strict';
var ICON={food:'🐟',water:'💧',wood:'🪵',stone:'🪨',coins:'🪙'};
var LABEL={food:'Food',water:'Water',wood:'Wood',stone:'Stone',coins:'Coins'};
var KEYS=['food','water','wood','stone','coins'];
var PHASES=['Event','Production','Market','Settle up'];
var app=document.getElementById('app'), toastEl=document.getElementById('toast');
var params=new URLSearchParams(location.search);
var code=(params.get('c')||'').toUpperCase();
var V=null, offset=0, es=null, draft=freshDraft(), joinInfo=null, msg='', screen='boot';
var cache={};

function freshDraft(){ return {to:'',give:[{r:'',q:1},{r:'',q:1}],get:[{r:'',q:1},{r:'',q:1}]}; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function items(list){ return list.map(function(x){return x.q+' '+ICON[x.r]+' '+LABEL[x.r];}).join(' + '); }
function costText(c){ return Object.keys(c).map(function(k){return c[k]+' '+ICON[k];}).join('  '); }
function store(){ try{return JSON.parse(localStorage.getItem('castaway-live-'+code)||'null');}catch(e){return null;} }
function setStore(v){ try{localStorage.setItem('castaway-live-'+code,JSON.stringify(v));}catch(e){} }
function toast(t){ toastEl.textContent=t; toastEl.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){toastEl.hidden=true;},3200); }
function setHTML(id,html){ var el=document.getElementById(id); if(!el) return; if(cache[id]!==html){ el.innerHTML=html; cache[id]=html; } }

function api(path,body){
  var s=store();
  return fetch('/api/g/'+code+'/'+path,{method:'POST',headers:{'Content-Type':'application/json','x-token':s?s.token:''},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong'); return j; });});
}
function act(path,body,after){ api(path,body).then(function(){ if(after) after(); }).catch(function(e){ toast(e.message); }); }

/* ---------- screens ---------- */
function showCode(){
  screen='code'; app.innerHTML='<div class="card"><h1>Castaway Economy</h1><p class="muted">Type the game code your teacher is showing.</p><input id="codeIn" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button id="codeGo">Join</button><div class="err" id="codeErr"></div></div>';
  var inp=document.getElementById('codeIn'); inp.focus();
  function go(){ var c=inp.value.trim().toUpperCase(); if(c.length!==4) return; location.search='?c='+c; }
  document.getElementById('codeGo').onclick=go; inp.onkeydown=function(e){ if(e.key==='Enter') go(); };
}
function showPick(){
  screen='pick';
  fetch('/api/g/'+code+'/info').then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error); return j; });}).then(function(info){
    joinInfo=info;
    app.innerHTML='<div class="card"><h1>Pick your island</h1><p class="muted">Game '+esc(code)+'. One island per team. Choose your own and stay on it for the whole game.</p><div class="islands">'+info.islands.map(function(i){
      return '<button class="islandbtn" style="--c:'+i.color+'" data-island="'+i.idx+'"'+(i.claimed?' disabled':'')+'>'+esc(i.name)+(i.claimed?'<br><small>taken</small>':'')+'</button>';
    }).join('')+'</div><div class="err" id="pickErr"></div><button class="sec" id="pickRefresh">Refresh</button></div>';
    app.onclick=function(e){
      var b=e.target.closest('[data-island]'); if(b){
        api('join',{island:+b.dataset.island}).then(function(r){ setStore({token:r.token,idx:r.idx}); app.onclick=null; start(); }).catch(function(er){ document.getElementById('pickErr').textContent=er.message; showPickSoon(); });
        return;
      }
      if(e.target.id==='pickRefresh') showPick();
    };
  }).catch(function(e){ app.innerHTML='<div class="card"><h1>Hmm</h1><p>'+esc(e.message)+'</p><button id="back">Try another code</button></div>'; document.getElementById('back').onclick=function(){ location.search=''; }; });
}
function showPickSoon(){ setTimeout(showPick,1200); }

function skeleton(){
  screen='game'; cache={};
  app.innerHTML='<div id="s-top"></div><div id="s-status"></div><div id="s-inv"></div><div id="s-offers"></div><div id="s-composer"></div><div id="s-projects"></div><div id="s-board"></div><div id="s-over"></div>';
  app.onclick=onClick; app.onchange=onChange;
}

/* ---------- rendering ---------- */
function timerLeft(){
  if(!V) return 0;
  if(V.timer.running) return Math.max(0,Math.ceil((V.timer.endsAt-(Date.now()+offset))/1000));
  return V.timer.left;
}
function mmss(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function render(){
  if(!V||screen!=='game') return;
  var me=V.me, st=V;
  setHTML('s-top','<div class="top" style="background:'+esc(me.color)+'"><div><div class="name">'+esc(me.name)+'</div><div class="sub">Round '+V.round+' of '+V.rounds+(V.over?' · Game over':' · '+PHASES[V.phase])+'</div></div><div class="pts">'+me.pts+'<small>points</small></div></div>');
  setHTML('s-status',statusHTML());
  setHTML('s-inv',invHTML());
  setHTML('s-offers',offersHTML());
  setHTML('s-composer',composerHTML());
  setHTML('s-projects',projectsHTML());
  setHTML('s-board',boardHTML());
  setHTML('s-over',overHTML());
  tick();
}
function tick(){
  var el=document.getElementById('timer'); if(!el||!V) return;
  var l=timerLeft(); el.textContent=V.locked?'0:00':mmss(l); el.className='timer'+(l<=30&&(V.timer.running||V.locked)?' low':'');
}
function statusHTML(){
  var h='', V_=V;
  if(V_.over) return '<div class="banner good">The game is over. See the final scores below.</div>';
  var ev=V_.event;
  if(V_.phase===0){
    if(!ev) return '<div class="card"><h2>Waiting for the event</h2><p class="muted">Your teacher will reveal this round\'s event card.</p></div>';
    return eventCard(ev)+'<div class="muted">Waiting for your teacher to collect production.</div>';
  }
  if(V_.phase===1){
    var g=V_.me.gained, t=g?KEYS.filter(function(k){return g[k]>0;}).map(function(k){return '+'+g[k]+' '+ICON[k];}).join('  '):'';
    return (ev?eventCard(ev):'')+'<div class="card"><h2>Production</h2><p>Your island made: <b>'+(t||'nothing')+'</b></p><p class="muted">Plan your trades. The market opens soon.</p></div>';
  }
  if(V_.phase===2){
    var out=(ev?eventCard(ev,true):'');
    if(V_.locked) return out+'<div class="banner bad">🔒 The market is locked. No more trades this round.</div>';
    return out+'<div class="card"><div class="timer" id="timer">'+mmss(timerLeft())+'</div>'+(V_.timer.running?'':'<div class="muted" style="text-align:center">Timer not running yet</div>')+'</div>';
  }
  if(V_.phase===3){
    if(!V_.settled) return '<div class="banner warn">Waiting for your teacher to pay needs.</div>';
    var l=V_.me.last, r='';
    if(l){
      var miss=Object.keys(l.short||{}).map(function(k){return l.short[k]+' '+ICON[k];}).join(' ');
      r=l.delta>0?'<div class="banner good">Needs paid in full: +'+l.delta+' points</div>':'<div class="banner bad">Went without '+miss+': '+l.delta+' points</div>';
    }
    return r+'<div class="muted">Now you can buy projects with what is left. Leftover coins are worth points at the end.</div>';
  }
  return h;
}
function eventCard(ev,compact){
  return '<div class="card"><div class="row spread"><h2>'+esc(ev.title)+'</h2><span class="tag">'+esc(ev.term)+'</span></div><p style="margin:0">'+esc(ev.text)+'</p>'+(ev.notes&&ev.notes.length&&!compact?'<div class="muted">'+ev.notes.map(esc).join('<br>')+'</div>':'')+(compact?'':'<p class="muted" style="margin:0"><i>'+esc(ev.ask)+'</i></p>')+'</div>';
}
function invHTML(){
  var me=V.me, needs=V.needs, showNeeds=!V.over&&!(V.phase===3&&V.settled);
  var chips=KEYS.map(function(k){
    var n=needs?needs[k]||0:0, short=showNeeds&&me.inv[k]<n;
    return '<div class="chip'+(short?' short':'')+'"><b>'+me.inv[k]+'</b><span>'+ICON[k]+' '+LABEL[k]+'</span>'+(showNeeds&&n?'<span class="need '+(short?'bad':'good')+'">need '+n+'</span>':'')+'</div>';
  }).join('');
  var per=V.constants.coinsPerPoint, c=me.inv.coins;
  var gap=showNeeds&&needs?KEYS.filter(function(k){return me.inv[k]<(needs[k]||0);}).map(function(k){return ((needs[k]||0)-me.inv[k])+' '+LABEL[k];}):[];
  return '<div class="card"><div class="row spread"><h3>Your goods</h3>'+(gap.length?'<span class="tag bad">Still need: '+esc(gap.join(', '))+'</span>':(showNeeds?'<span class="tag done">Needs covered</span>':''))+'</div><div class="chips">'+chips+'</div>'+
    '<div class="muted">🪙 <b>'+per+' coins = 1 point</b> at the end. You have '+c+' coins, worth '+Math.floor(c/per)+' point'+(Math.floor(c/per)===1?'':'s')+' right now. Coins also pay the tax.</div></div>';
}
function offersHTML(){
  if(V.over) return '';
  var offers=V.offers||[], me=V.me.idx;
  var inc=offers.filter(function(o){return o.to===me&&o.status==='pending';});
  var out=offers.filter(function(o){return o.from===me&&o.status==='pending';});
  var past=offers.filter(function(o){return o.status!=='pending';}).slice(0,5);
  if(!inc.length&&!out.length&&!past.length) return '';
  var h='';
  inc.forEach(function(o){
    h+='<div class="offer incoming"><div><b>'+esc(o.fromName)+'</b> offers you:</div><div class="deal"><span>You get <b>'+items(o.give)+'</b></span><span>You give <b>'+items(o.get)+'</b></span></div><div class="row"><button data-act="resp" data-id="'+o.id+'" data-a="accept"'+(V.phase!==2||V.locked?' disabled':'')+'>Accept</button><button class="sec" data-act="resp" data-id="'+o.id+'" data-a="decline">Decline</button></div></div>';
  });
  out.forEach(function(o){
    h+='<div class="offer"><div class="row spread"><span>To <b>'+esc(o.toName)+'</b>: you give <b>'+items(o.give)+'</b>, you get <b>'+items(o.get)+'</b></span><span class="tag">waiting</span></div><button class="sec" data-act="resp" data-id="'+o.id+'" data-a="cancel">Cancel offer</button></div>';
  });
  if(past.length){
    h+='<div class="muted">Recent</div>'+past.map(function(o){
      var mine=o.from===me, other=mine?o.toName:o.fromName;
      var label={done:'done',declined:'declined',cancelled:'cancelled',expired:'timed out',failed:'failed'}[o.status]||o.status;
      return '<div class="deal muted"><span class="tag '+(o.status==='done'?'done':'bad')+'">'+label+'</span><span>'+esc(other)+': '+items(mine?o.give:o.get)+' for '+items(mine?o.get:o.give)+(o.note?' ('+esc(o.note)+')':'')+'</span></div>';
    }).join('');
  }
  return '<div class="card"><h3>Offers</h3>'+h+'</div>';
}
function resOptions(sel,allowBlank){
  var h=allowBlank?'<option value=""'+(sel===''?' selected':'')+'>— nothing —</option>':'<option value=""'+(sel===''?' selected':'')+' disabled>Pick…</option>';
  KEYS.forEach(function(k){ h+='<option value="'+k+'"'+(sel===k?' selected':'')+'>'+ICON[k]+' '+LABEL[k]+'</option>'; });
  return h;
}
function composerHTML(){
  if(V.over||V.phase!==2||V.locked) return '';
  var side=function(S,title){
    var rows=[0,1].map(function(i){
      var it=draft[S][i], hide=i===1&&!draft[S][0].r;
      if(hide) return '';
      var st_='<div class="stepper"><button class="sec" data-act="q" data-s="'+S+'" data-i="'+i+'" data-d="-1" aria-label="Less">−</button><span class="q">'+it.q+'</span><button class="sec" data-act="q" data-s="'+S+'" data-i="'+i+'" data-d="1" aria-label="More">+</button></div>';
      return '<div class="step">'+(i===1&&!it.r?'':st_)+'<select data-sel="r" data-s="'+S+'" data-i="'+i+'" aria-label="Item">'+resOptions(it.r,i===1)+'</select></div>';
    }).join('');
    return '<fieldset class="side"><legend>'+title+'</legend>'+rows+'</fieldset>';
  };
  var opts='<option value=""'+(draft.to===''?' selected':'')+' disabled>Choose an island…</option>'+V.islands.filter(function(i){return i.idx!==V.me.idx;}).map(function(i){return '<option value="'+i.idx+'"'+(String(draft.to)===String(i.idx)?' selected':'')+'>'+esc(i.name)+'</option>';}).join('');
  return '<div class="card"><h3>Make an offer</h3><select data-sel="to" aria-label="Trade with">'+opts+'</select>'+side('give','You give')+side('get','You get')+'<div class="err" id="draftErr">'+esc(msg)+'</div><button data-act="send">Send offer</button><div class="muted">The other team has to accept before anything moves. You can offer up to 2 different goods each way, coins included.</div></div>';
}
function projectsHTML(){
  if(V.over||V.phase!==3||!V.settled) return '';
  return '<div class="card"><h3>Buy a project</h3>'+V.projects.map(function(p){
    return '<div class="proj"><div><div class="t">'+esc(p.name)+'</div><div class="muted">'+costText(p.cost)+' → '+esc(p.blurb)+'</div></div>'+(p.owned?'<span class="tag done">Owned</span>':'<button data-act="buy" data-p="'+p.id+'"'+(p.canBuy?'':' disabled')+'>Buy</button>')+'</div>';
  }).join('')+'</div>';
}
function boardHTML(){
  if(V.over||!V.board.length) return '';
  return '<div class="card"><h3>Deals this round</h3>'+V.board.map(function(t){
    return '<div class="deal"><span class="dot" style="background:'+esc(t.aColor)+'"></span><b>'+esc(t.a)+'</b> gave '+items(t.aItems)+' to <span class="dot" style="background:'+esc(t.bColor)+'"></span><b>'+esc(t.b)+'</b> for '+items(t.bItems)+'</div>';
  }).join('')+'</div>';
}
function overHTML(){
  if(!V.over||!V.scores) return '';
  return '<div class="card"><h2>Final scores</h2><table><tr><th>Island</th><th class="n">Points</th><th class="n">Coin bonus</th><th class="n">Total</th></tr>'+V.scores.map(function(s,i){
    return '<tr><td>'+(i===0?'🏆 ':'')+esc(s.name)+'</td><td class="n">'+s.pts+'</td><td class="n">+'+s.bonus+'</td><td class="n"><b>'+s.total+'</b></td></tr>';
  }).join('')+'</table></div>';
}

/* ---------- events ---------- */
function onChange(e){
  var t=e.target, sel=t.dataset.sel; if(!sel) return;
  if(sel==='to') draft.to=t.value;
  if(sel==='r'){ var row=draft[t.dataset.s][+t.dataset.i]; row.r=t.value; if(+t.dataset.i===0&&!t.value){ draft[t.dataset.s][1].r=''; } }
  msg=''; render();
}
function onClick(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var a=b.dataset.act;
  if(a==='q'){ var row=draft[b.dataset.s][+b.dataset.i]; row.q=Math.max(1,Math.min(30,row.q+(+b.dataset.d))); msg=''; render(); }
  else if(a==='send'){
    function pack(S){ var out=[]; draft[S].forEach(function(x){ if(x.r) out.push({r:x.r,q:x.q}); }); return out; }
    var give=pack('give'), get=pack('get');
    if(draft.to===''){ msg='Choose an island to trade with.'; return render(); }
    if(!give.length||!get.length){ msg='Pick at least one good on each side.'; return render(); }
    var gk=give.map(function(x){return x.r;}), bad=get.some(function(x){return gk.indexOf(x.r)>=0;});
    if(bad){ msg='You cannot give and get the same good.'; return render(); }
    for(var i=0;i<give.length;i++){ if(V.me.inv[give[i].r]<give[i].q){ msg='You only have '+V.me.inv[give[i].r]+' '+LABEL[give[i].r]+'.'; return render(); } }
    msg=''; act('team/offer',{to:+draft.to,give:give,get:get},function(){ draft=freshDraft(); toast('Offer sent'); });
  }
  else if(a==='resp') act('team/respond',{id:+b.dataset.id,action:b.dataset.a},function(){ if(b.dataset.a==='accept') toast('Deal done!'); });
  else if(a==='buy') act('team/buy',{project:b.dataset.p},function(){ toast('Bought!'); });
}

/* ---------- connection ---------- */
function connect(){
  var s=store(); if(!s) return;
  if(es) es.close();
  es=new EventSource('/api/g/'+code+'/stream?token='+encodeURIComponent(s.token));
  es.onmessage=function(m){
    var v=JSON.parse(m.data); offset=v.serverNow-Date.now(); V=v;
    if(screen!=='game') skeleton();
    render();
  };
  es.onerror=function(){
    // a 401 means our token is stale (game restarted or island released): check once
    fetch('/api/g/'+code+'/state?token='+encodeURIComponent(s.token)).then(function(r){
      if(r.status===401||r.status===404){ es.close(); setStore(null); showPick(); }
    }).catch(function(){});
  };
}
function start(){ var s=store(); if(s){ connect(); } else showPick(); }
setInterval(tick,250);
if(!code) showCode(); else start();
})();
</script>
</body>
</html>
