<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castaway Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* Phone screen in the original's look. Bare buttons are the main (sun) action; .sec buttons are the quieter grey ones. */
body{padding-bottom:40px}
main{max-width:640px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
[id^="s-"]{display:contents}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h1{font-size:clamp(1.9rem,8vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.card h2{font-size:1.25rem;font-weight:800}
.card h3{font-size:1.05rem;font-weight:800}
.card p{margin:0}
.muted{font-size:.92rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:var(--surface);border-top:8px solid var(--c)}
.top .name{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1}
.top .sub{font-size:.88rem;font-weight:700;color:var(--muted)}
.top .pts{text-align:right;line-height:1;color:var(--muted);font-size:.8rem;font-weight:700}
.top .pts b{display:block;font-family:var(--display);font-size:2rem;font-weight:800;color:var(--text)}
button{background:var(--sun);color:var(--sun-ink);border:1px solid var(--sun);border-radius:10px;padding:11px 16px;font-weight:700;min-height:44px}
button:hover{filter:brightness(1.08)}
button.sec{background:var(--surface-2);color:var(--text);border-color:var(--line)}
button.sec:hover{filter:none;border-color:var(--muted)}
button.bad{background:var(--coral);color:var(--coral-ink);border-color:var(--coral)}
button:disabled{background:var(--surface-2);color:var(--text);border-color:var(--line);opacity:.4;cursor:not-allowed;filter:none}
select{min-height:44px;padding:8px 10px}
.timer{font-size:3.4rem}
.banner{border-radius:10px;padding:10px 12px;font-weight:700;text-align:center}
.banner.warn{background:rgba(255,201,74,.14);color:var(--sun)}
.banner.bad{background:rgba(255,107,87,.16);color:var(--bad)}
.banner.good{background:rgba(61,219,176,.14);color:var(--good)}
.tstep{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-4px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{background:var(--bg);color:var(--text);border:1px solid var(--line);border-left:6px solid var(--c);padding:8px 12px;min-height:40px;font-weight:700}
.tchip:hover{filter:none;border-color:var(--muted);border-left-color:var(--c)}
.tchip.on{background:var(--c);border-color:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tsides{display:flex;flex-direction:column;gap:8px}
.tside{background:var(--bg);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--coral)}
.tside.get{border-left-color:var(--good)}
.tside-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:0 2px}
.tside-h small{color:var(--muted);font-size:.75rem;font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tg{display:flex;flex-direction:column;gap:3px;border-radius:10px;padding:3px;background:var(--surface);border:2px solid transparent;min-width:0}
.tg.on{border-color:var(--sun);background:rgba(255,201,74,.1)}
.tg-tap{background:none;border:none;color:var(--text);padding:4px 0 2px;min-height:0;display:flex;flex-direction:column;align-items:center;line-height:1.05;border-radius:8px}
.tg-tap:hover{filter:none;background:rgba(255,255,255,.04)}
.tg-tap:disabled{background:none;opacity:1;cursor:default}
.tg.off .tg-tap{opacity:.35}
.tg-ic{font-size:1.5rem}
.tg-q{font-family:var(--display);font-size:1.35rem;font-weight:800}
.tg:not(.on) .tg-q{color:var(--muted)}
.tg-tap small{color:var(--muted);font-size:.64rem;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tg-pm{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tg .tb{min-height:34px;padding:0;font-size:1.15rem;border-radius:7px}
.tsum{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:1.15rem}
.tsum .arrow{color:var(--sun);font-size:1.4rem}
button.link{background:none;border:none;color:var(--muted);min-height:0;padding:4px 6px;font-size:.85rem;text-decoration:underline}
.offer{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--line)}
.offer.incoming{border-left-color:var(--sun)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--surface-2)}
.tag.done{background:rgba(61,219,176,.14);color:var(--good)} .tag.bad{background:rgba(255,107,87,.16);color:var(--bad)}
.err{color:var(--bad);font-weight:700}
.err:empty{display:none}
.islands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.islandbtn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-left:8px solid var(--c);text-align:left;font-family:var(--display);font-weight:800;font-size:1.1rem;padding:12px}
.islandbtn:hover{filter:none;border-color:var(--muted);border-left-color:var(--c)}
.islandbtn small{font-family:var(--body);font-weight:700;color:var(--muted);font-size:.8rem}
.proj{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 12px}
.proj .t{font-weight:800}
.deal{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline}
.deal-card{padding:8px 12px}
.deal-card .dc-items{font-size:1rem;flex-basis:100%}
.deal-card .dc-isl{font-size:1.05rem}
td.n,th.n{text-align:right}
.toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:616px;margin:0 auto;background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:5}
@media (max-width:380px){.inv-i b{font-size:1.4rem}.timer{font-size:2.8rem}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
'use strict';
var ICON={food:'🐟',water:'💧',wood:'🪵',stone:'🪨',coins:'🪙'};
var LABEL={food:'Food',water:'Water',wood:'Wood',stone:'Stone',coins:'Coins'};
var KEYS=['food','water','wood','stone','coins'];
var PHASES=['Event','Production','Market','Settle up'];
var app=document.getElementById('app'), toastEl=document.getElementById('toast');
var params=new URLSearchParams(location.search);
var code=(params.get('c')||'').toUpperCase();
var V=null, offset=0, es=null, draft=freshDraft(), joinInfo=null, msg='', screen='boot';
var cache={};

function zero(){ return {food:0,water:0,wood:0,stone:0,coins:0}; }
function freshDraft(){ return {to:'',give:zero(),get:zero()}; }
function picked(S){ return KEYS.filter(function(k){return draft[S][k]>0;}).map(function(k){return {r:k,q:draft[S][k]};}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function items(list){ return list.map(function(x){return x.q+' '+ICON[x.r]+' '+LABEL[x.r];}).join(' + '); }
function costText(c){ return Object.keys(c).map(function(k){return c[k]+' '+ICON[k];}).join('  '); }
function store(){ try{return JSON.parse(localStorage.getItem('castaway-live-'+code)||'null');}catch(e){return null;} }
function setStore(v){ try{localStorage.setItem('castaway-live-'+code,JSON.stringify(v));}catch(e){} }
function toast(t){ toastEl.textContent=t; toastEl.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){toastEl.hidden=true;},3200); }
function setHTML(id,html){ var el=document.getElementById(id); if(!el) return; if(cache[id]!==html){ el.innerHTML=html; cache[id]=html; } }

function api(path,body){
  var s=store();
  return fetch('/api/g/'+code+'/'+path,{method:'POST',headers:{'Content-Type':'application/json','x-token':s?s.token:''},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong'); return j; });});
}
function act(path,body,after){ api(path,body).then(function(){ if(after) after(); }).catch(function(e){ toast(e.message); }); }

/* ---------- screens ---------- */
function showCode(){
  screen='code'; app.innerHTML='<div class="card"><h1>Castaway Economy</h1><p class="muted">Type the game code your teacher is showing.</p><input id="codeIn" class="codein" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button id="codeGo">Join</button><div class="err" id="codeErr"></div></div>';
  var inp=document.getElementById('codeIn'); inp.focus();
  function go(){ var c=inp.value.trim().toUpperCase(); if(c.length!==4) return; location.search='?c='+c; }
  document.getElementById('codeGo').onclick=go; inp.onkeydown=function(e){ if(e.key==='Enter') go(); };
}
function showPick(){
  screen='pick';
  fetch('/api/g/'+code+'/info').then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error); return j; });}).then(function(info){
    joinInfo=info;
    app.innerHTML='<div class="card"><h1>Pick your island</h1><p class="muted">Game '+esc(code)+'. One island per team. Choose your own and stay on it for the whole game.</p><div class="islands">'+info.islands.map(function(i){
      return '<button class="islandbtn" style="--c:'+i.color+'" data-island="'+i.idx+'"'+(i.claimed?' disabled':'')+'>'+esc(i.name)+(i.claimed?'<br><small>taken</small>':'')+'</button>';
    }).join('')+'</div><div class="err" id="pickErr"></div><button class="sec" id="pickRefresh">Refresh</button></div>';
    app.onclick=function(e){
      var b=e.target.closest('[data-island]'); if(b){
        api('join',{island:+b.dataset.island}).then(function(r){ setStore({token:r.token,idx:r.idx}); app.onclick=null; start(); }).catch(function(er){ document.getElementById('pickErr').textContent=er.message; showPickSoon(); });
        return;
      }
      if(e.target.id==='pickRefresh') showPick();
    };
  }).catch(function(e){ app.innerHTML='<div class="card"><h1>Hmm</h1><p>'+esc(e.message)+'</p><button id="back">Try another code</button></div>'; document.getElementById('back').onclick=function(){ location.search=''; }; });
}
function showPickSoon(){ setTimeout(showPick,1200); }

function skeleton(){
  screen='game'; cache={};
  app.innerHTML='<div id="s-top"></div><div id="s-status"></div><div id="s-inv"></div><div id="s-offers"></div><div id="s-composer"></div><div id="s-projects"></div><div id="s-board"></div><div id="s-over"></div>';
  app.onclick=onClick; app.onchange=onChange;
}

/* ---------- rendering ---------- */
function timerLeft(){
  if(!V) return 0;
  if(V.timer.running) return Math.max(0,Math.ceil((V.timer.endsAt-(Date.now()+offset))/1000));
  return V.timer.left;
}
function mmss(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function render(){
  if(!V||screen!=='game') return;
  var me=V.me, st=V;
  setHTML('s-top','<div class="top" style="--c:'+esc(me.color)+'"><div><div class="name">'+esc(me.name)+'</div><div class="sub">Round '+V.round+' of '+V.rounds+(V.over?' · Game over':' · '+PHASES[V.phase])+'</div></div><div class="pts"><b class="num">'+me.pts+'</b>points</div></div>');
  setHTML('s-status',statusHTML());
  setHTML('s-inv',invHTML());
  setHTML('s-offers',offersHTML());
  setHTML('s-composer',composerHTML());
  setHTML('s-projects',projectsHTML());
  setHTML('s-board',boardHTML());
  setHTML('s-over',overHTML());
  tick();
}
function tick(){
  var el=document.getElementById('timer'); if(!el||!V) return;
  var l=timerLeft(); el.textContent=V.locked?'0:00':mmss(l); el.className='timer'+(l<=30&&(V.timer.running||V.locked)?' low':'');
}
function statusHTML(){
  var h='', V_=V;
  if(V_.over) return '<div class="banner good">The game is over. See the final scores below.</div>';
  var ev=V_.event;
  if(V_.phase===0){
    if(!ev) return '<div class="card"><h2>Waiting for the event</h2><p class="muted">Your teacher will reveal this round\'s event card.</p></div>';
    return eventCard(ev)+'<div class="muted">Waiting for your teacher to collect production.</div>';
  }
  if(V_.phase===1){
    var g=V_.me.gained, t=g?KEYS.filter(function(k){return g[k]>0;}).map(function(k){return '+'+g[k]+' '+ICON[k];}).join('  '):'';
    return (ev?eventCard(ev):'')+'<div class="card"><h2>Production</h2><p>Your island made: <b>'+(t||'nothing')+'</b></p><p class="muted">Plan your trades. The market opens soon.</p></div>';
  }
  if(V_.phase===2){
    var out=(ev?eventCard(ev,true):'');
    if(V_.locked) return out+'<div class="banner bad">🔒 The market is locked. No more trades this round.</div>';
    return out+'<div class="card"><div class="timer" id="timer" role="timer" aria-live="off">'+mmss(timerLeft())+'</div>'+(V_.timer.running?'':'<div class="muted" style="text-align:center">Timer not running yet</div>')+'</div>';
  }
  if(V_.phase===3){
    if(!V_.settled) return '<div class="banner warn">Waiting for your teacher to pay needs.</div>';
    var l=V_.me.last, r='';
    if(l){
      var miss=Object.keys(l.short||{}).map(function(k){return l.short[k]+' '+ICON[k];}).join(' ');
      r=l.delta>0?'<div class="banner good">Needs paid in full: +'+l.delta+' points</div>':'<div class="banner bad">Went without '+miss+': '+l.delta+' points</div>';
    }
    return r+'<div class="muted">Now you can buy projects with what is left. Leftover coins are worth points at the end.</div>';
  }
  return h;
}
function eventCard(ev,compact){
  return '<div class="evcard'+(compact?' compact':'')+'"><span class="term">'+esc(ev.term)+'</span><h3>'+esc(ev.title)+'</h3><p>'+esc(ev.text)+'</p></div>'+(ev.notes&&ev.notes.length&&!compact?'<div class="card"><ul class="notes">'+ev.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul></div>':'')+(compact?'':'<div class="ask"><b>Think about it</b>'+esc(ev.ask)+'</div>');
}
function invHTML(){
  var me=V.me, needs=V.needs, showNeeds=!V.over&&!(V.phase===3&&V.settled);
  var chips=KEYS.map(function(k){
    var n=needs?needs[k]||0:0, short=showNeeds&&me.inv[k]<n;
    return '<div class="inv-i '+k+(short?' short':'')+'"><span class="ic">'+ICON[k]+'</span><b class="num">'+me.inv[k]+'</b><small>'+LABEL[k]+'</small>'+(showNeeds&&n?'<span class="need '+(short?'bad':'good')+'">need '+n+'</span>':'')+'</div>';
  }).join('');
  var per=V.constants.coinsPerPoint, c=me.inv.coins;
  var gap=showNeeds&&needs?KEYS.filter(function(k){return me.inv[k]<(needs[k]||0);}).map(function(k){return ((needs[k]||0)-me.inv[k])+' '+LABEL[k];}):[];
  return '<div class="card"><div class="row spread"><h3>Your goods</h3>'+(gap.length?'<span class="tag bad">Still need: '+esc(gap.join(', '))+'</span>':(showNeeds?'<span class="tag done">Needs covered</span>':''))+'</div><div class="inv">'+chips+'</div>'+
    '<div class="muted">🪙 <b>'+per+' coins = 1 point</b> at the end. You have '+c+' coins, worth '+Math.floor(c/per)+' point'+(Math.floor(c/per)===1?'':'s')+' right now. Coins also pay the tax.</div></div>';
}
function offersHTML(){
  if(V.over) return '';
  var offers=V.offers||[], me=V.me.idx;
  var inc=offers.filter(function(o){return o.to===me&&o.status==='pending';});
  var out=offers.filter(function(o){return o.from===me&&o.status==='pending';});
  var past=offers.filter(function(o){return o.status!=='pending';}).slice(0,5);
  if(!inc.length&&!out.length&&!past.length) return '';
  var h='';
  inc.forEach(function(o){
    h+='<div class="offer incoming"><div><b>'+esc(o.fromName)+'</b> offers you:</div><div class="deal"><span>You get <b>'+items(o.give)+'</b></span><span>You give <b>'+items(o.get)+'</b></span></div><div class="row"><button data-act="resp" data-id="'+o.id+'" data-a="accept"'+(V.phase!==2||V.locked?' disabled':'')+'>Accept</button><button class="sec" data-act="resp" data-id="'+o.id+'" data-a="decline">Decline</button></div></div>';
  });
  out.forEach(function(o){
    h+='<div class="offer"><div class="row spread"><span>To <b>'+esc(o.toName)+'</b>: you give <b>'+items(o.give)+'</b>, you get <b>'+items(o.get)+'</b></span><span class="tag">waiting</span></div><button class="sec" data-act="resp" data-id="'+o.id+'" data-a="cancel">Cancel offer</button></div>';
  });
  if(past.length){
    h+='<div class="muted">Recent</div>'+past.map(function(o){
      var mine=o.from===me, other=mine?o.toName:o.fromName;
      var label={done:'done',declined:'declined',cancelled:'cancelled',expired:'timed out',failed:'failed'}[o.status]||o.status;
      return '<div class="deal muted"><span class="tag '+(o.status==='done'?'done':'bad')+'">'+label+'</span><span>'+esc(other)+': '+items(mine?o.give:o.get)+' for '+items(mine?o.get:o.give)+(o.note?' ('+esc(o.note)+')':'')+'</span></div>';
    }).join('');
  }
  return '<div class="card"><h3>Offers</h3>'+h+'</div>';
}
function composerHTML(){
  if(V.over||V.phase!==2||V.locked) return '';
  var others=V.islands.filter(function(i){return i.idx!==V.me.idx;});
  var chips=others.map(function(i){
    var on=String(draft.to)===String(i.idx);
    return '<button class="tchip'+(on?' on':'')+'" style="--c:'+esc(i.color)+'" data-act="to" data-to="'+i.idx+'" aria-pressed="'+on+'">'+esc(i.name)+'</button>';
  }).join('');
  var side=function(S,title){
    var other=S==='give'?'get':'give', used=picked(S).length;
    var rows=KEYS.map(function(k){
      var q=draft[S][k], have=V.me.inv[k];
      var blocked=draft[other][k]>0;
      var max=S==='give'?Math.min(99,have):99;
      var canAdd=!blocked&&q<max&&(q>0||used<2);
      var note=blocked?(S==='give'?'getting':'giving'):(S==='give'?'have '+have:'');
      return '<div class="tg'+(q>0?' on':'')+(blocked||(S==='give'&&!have&&!q)?' off':'')+'">'+
        '<button class="tg-tap" data-act="q" data-s="'+S+'" data-r="'+k+'" data-d="1" aria-label="Add one '+LABEL[k]+'"'+(canAdd?'':' disabled')+'>'+
        '<span class="tg-ic" aria-hidden="true">'+ICON[k]+'</span><b class="tg-q num">'+q+'</b><small>'+(note||LABEL[k])+'</small></button>'+
        '<div class="tg-pm"><button class="sec tb" data-act="q" data-s="'+S+'" data-r="'+k+'" data-d="-1" aria-label="One less '+LABEL[k]+'"'+(q>0?'':' disabled')+'>−</button>'+
        '<button class="sec tb" data-act="q" data-s="'+S+'" data-r="'+k+'" data-d="1" aria-label="One more '+LABEL[k]+'"'+(canAdd?'':' disabled')+'>+</button></div></div>';
    }).join('');
    return '<div class="tside '+S+'"><div class="tside-h"><b>'+title+'</b><small>'+(used>=2?'2 goods max':'tap to add · up to 2 goods')+'</small></div><div class="tgrid">'+rows+'</div></div>';
  };
  var give=picked('give'), get=picked('get'), toI=others.filter(function(i){return String(i.idx)===String(draft.to);})[0];
  var fmt=function(l){ return l.length?l.map(function(x){return '<b>'+x.q+'</b> '+ICON[x.r];}).join(' + '):'<span class="muted">?</span>'; };
  var ready=toI&&give.length&&get.length;
  var summary='<div class="tsum"><span>'+fmt(give)+'</span><span class="arrow" aria-hidden="true">⇄</span><span>'+fmt(get)+'</span></div>';
  var dirty=give.length||get.length||draft.to!=='';
  return '<div class="card composer"><div class="row spread"><h3>Make an offer</h3>'+(dirty?'<button class="sec link" data-act="clear">Clear</button>':'')+'</div>'+
    '<div class="tstep">1. Trade with</div><div class="tchips">'+chips+'</div>'+
    '<div class="tstep">2. Choose goods</div><div class="tsides">'+side('give','You give')+side('get','You get')+'</div>'+
    summary+'<div class="err" id="draftErr">'+esc(msg)+'</div>'+
    '<button data-act="send"'+(ready?'':' disabled')+'>'+(toI?'Send offer to '+esc(toI.name):'Send offer')+'</button>'+
    '<div class="muted">The other team has to accept before anything moves.</div></div>';
}
function projectsHTML(){
  if(V.over||V.phase!==3||!V.settled) return '';
  return '<div class="card"><h3>Buy a project</h3>'+V.projects.map(function(p){
    return '<div class="proj"><div><div class="t">'+esc(p.name)+'</div><div class="muted">'+costText(p.cost)+' → '+esc(p.blurb)+'</div></div>'+(p.owned?'<span class="tag done">Owned</span>':'<button data-act="buy" data-p="'+p.id+'"'+(p.canBuy?'':' disabled')+'>Buy</button>')+'</div>';
  }).join('')+'</div>';
}
function boardHTML(){
  if(V.over||!V.board.length) return '';
  return '<div class="card tboard"><h3>Deals this round <span class="count">'+V.board.length+'</span></h3><ul class="board-list">'+V.board.map(function(t,i){
    return '<li class="deal-card'+(i===0?' newest':'')+'"><div class="dc-isl"><span class="dot" style="--c:'+esc(t.aColor)+'"></span> '+esc(t.a)+' <span aria-hidden="true">&#8644;</span> <span class="dot" style="--c:'+esc(t.bColor)+'"></span> '+esc(t.b)+'</div><div class="dc-items">'+items(t.aItems)+' <span aria-hidden="true">&#8594;</span> '+esc(t.b)+' &nbsp;|&nbsp; '+items(t.bItems)+' <span aria-hidden="true">&#8594;</span> '+esc(t.a)+'</div></li>';
  }).join('')+'</ul></div>';
}
function overHTML(){
  if(!V.over||!V.scores) return '';
  return '<div class="card"><h2>Final scores</h2><table><tr><th>Island</th><th class="n">Points</th><th class="n">Coin bonus</th><th class="n">Total</th></tr>'+V.scores.map(function(s,i){
    return '<tr><td>'+(i===0?'🏆 ':'')+esc(s.name)+'</td><td class="n">'+s.pts+'</td><td class="n">+'+s.bonus+'</td><td class="n"><b>'+s.total+'</b></td></tr>';
  }).join('')+'</table></div>';
}

/* ---------- events ---------- */
function onChange(e){
  var t=e.target, sel=t.dataset.sel; if(!sel) return;
  if(sel==='to') draft.to=t.value;
  msg=''; render();
}
function onClick(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var a=b.dataset.act;
  if(a==='q'){ var S=b.dataset.s, k=b.dataset.r; draft[S][k]=Math.max(0,Math.min(99,draft[S][k]+(+b.dataset.d))); msg=''; render(); }
  else if(a==='to'){ draft.to=String(draft.to)===b.dataset.to?'':b.dataset.to; msg=''; render(); }
  else if(a==='clear'){ draft=freshDraft(); msg=''; render(); }
  else if(a==='send'){
    var give=picked('give'), get=picked('get');
    if(draft.to===''){ msg='Choose an island to trade with.'; return render(); }
    if(!give.length||!get.length){ msg='Pick at least one good on each side.'; return render(); }
    if(give.length>2||get.length>2){ msg='Up to 2 different goods each way.'; return render(); }
    var gk=give.map(function(x){return x.r;}), bad=get.some(function(x){return gk.indexOf(x.r)>=0;});
    if(bad){ msg='You cannot give and get the same good.'; return render(); }
    for(var i=0;i<give.length;i++){ if(V.me.inv[give[i].r]<give[i].q){ msg='You only have '+V.me.inv[give[i].r]+' '+LABEL[give[i].r]+'.'; return render(); } }
    msg=''; act('team/offer',{to:+draft.to,give:give,get:get},function(){ draft=freshDraft(); toast('Offer sent'); });
  }
  else if(a==='resp') act('team/respond',{id:+b.dataset.id,action:b.dataset.a},function(){ if(b.dataset.a==='accept') toast('Deal done!'); });
  else if(a==='buy') act('team/buy',{project:b.dataset.p},function(){ toast('Bought!'); });
}

/* ---------- connection ---------- */
function connect(){
  var s=store(); if(!s) return;
  if(es) es.close();
  es=new EventSource('/api/g/'+code+'/stream?token='+encodeURIComponent(s.token));
  es.onmessage=function(m){
    var v=JSON.parse(m.data); offset=v.serverNow-Date.now(); V=v;
    if(screen!=='game') skeleton();
    render();
  };
  es.onerror=function(){
    // a 401 means our token is stale (game restarted or island released): check once
    fetch('/api/g/'+code+'/state?token='+encodeURIComponent(s.token)).then(function(r){
      if(r.status===401||r.status===404){ es.close(); setStore(null); showPick(); }
    }).catch(function(){});
  };
}
function start(){ var s=store(); if(s){ connect(); } else showPick(); }
setInterval(tick,250);
if(!code) showCode(); else start();
})();
</script>
