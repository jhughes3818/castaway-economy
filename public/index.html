<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castaway Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
.setup{max-width:760px;margin:24px auto;padding:0 16px;display:flex;flex-direction:column;gap:20px}
.setup h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;letter-spacing:-.02em}
.setup h1 span{color:var(--sun)}
.lead{font-size:1.15rem;max-width:56ch;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.panel .btn.primary{align-self:flex-start}
.err{color:var(--bad);font-weight:700}
.err:empty,.resume:empty{display:none}
.resume a{margin-right:12px}
</style>
</head>
<body>
<div class="setup">
<h1>Castaway <span>Economy</span></h1>
<p class="lead">Each team runs an island that makes plenty of some things and none of others. To survive and build, you have to trade. Random events shake up what everything is worth.</p>
<section class="panel"><h2>I am a student</h2><p class="muted">Enter the code your teacher is showing.</p>
<input class="codein" id="jc" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button class="btn primary" id="join">Join</button></section>
<section class="panel"><h2>I am a teacher</h2>
<div class="opts"><div class="field"><label for="rounds">Rounds</label><select id="rounds"><option>4</option><option>5</option><option selected>6</option><option>7</option></select></div>
<div class="field"><label for="tlen">Market timer (seconds)</label><input id="tlen" type="number" min="30" max="900" step="15" value="240"></div></div>
<button class="btn primary" id="create">Create a game</button><div class="err" id="err" role="alert"></div>
<div id="resume" class="resume"></div></section>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
function go(){ var c=$('jc').value.trim().toUpperCase(); if(c.length===4) location.href='/play?c='+c; }
$('join').onclick=go; $('jc').onkeydown=function(e){ if(e.key==='Enter') go(); };
$('create').onclick=function(){
  fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rounds:+$('rounds').value,timerLen:+$('tlen').value})})
   .then(function(r){return r.json();}).then(function(j){ if(!j.code) throw new Error('Could not create the game'); localStorage.setItem('castaway-host-'+j.code,j.teacherToken); location.href='/host?c='+j.code; })
   .catch(function(e){ $('err').textContent=e.message; });
};
var mine=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k.indexOf('castaway-host-')===0) mine.push(k.slice(14)); } }catch(e){}
if(mine.length){ $('resume').innerHTML='<div class="muted">Resume a game on this computer:</div>'+mine.map(function(c){return '<a href="/host?c='+c+'">'+c+'</a>';}).join(''); }
})();
</script>
</body>
</html>
