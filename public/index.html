<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castaway Economy</title>
<style>
:root{--bg:#0f2430;--surface:#17394a;--line:#2c6179;--text:#f3f7f9;--muted:#a9c3cf;--accent:#4fc3f7;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:620px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:2.2rem} h2{margin:0;font-size:1.25rem}
.card{background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:.92rem}
label{display:flex;justify-content:space-between;align-items:center;gap:12px}
input,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:110px}
input.code{width:100%;font-size:1.8rem;letter-spacing:.3em;text-align:center;text-transform:uppercase}
button{font:inherit;background:var(--accent);color:#06222e;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;min-height:46px}
button.sec{background:#1f4a5f;color:var(--text)}
.err{color:#ff9b8a;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Castaway Economy</h1>
<div class="card"><h2>I am a student</h2><p class="muted" style="margin:0">Enter the code your teacher is showing.</p>
<input class="code" id="jc" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button id="join">Join</button></div>
<div class="card"><h2>I am a teacher</h2>
<label>Rounds <select id="rounds"><option>4</option><option>5</option><option selected>6</option><option>7</option></select></label>
<label>Market timer (seconds) <input id="tlen" type="number" min="30" max="900" step="15" value="240"></label>
<button id="create">Create a game</button><div class="err" id="err"></div>
<div id="resume"></div></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
function go(){ var c=$('jc').value.trim().toUpperCase(); if(c.length===4) location.href='/play?c='+c; }
$('join').onclick=go; $('jc').onkeydown=function(e){ if(e.key==='Enter') go(); };
$('create').onclick=function(){
  fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rounds:+$('rounds').value,timerLen:+$('tlen').value})})
   .then(function(r){return r.json();}).then(function(j){ if(!j.code) throw new Error('Could not create the game'); localStorage.setItem('castaway-host-'+j.code,j.teacherToken); location.href='/host?c='+j.code; })
   .catch(function(e){ $('err').textContent=e.message; });
};
var mine=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k.indexOf('castaway-host-')===0) mine.push(k.slice(14)); } }catch(e){}
if(mine.length){ $('resume').innerHTML='<div class="muted">Resume a game on this computer:</div>'+mine.map(function(c){return '<a href="/host?c='+c+'" style="color:#4fc3f7;font-weight:800;margin-right:12px">'+c+'</a>';}).join(''); }
})();
</script>
</body>
</html>
