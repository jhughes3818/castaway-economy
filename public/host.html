<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castaway Economy: teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/qrcode.js"></script>
<style>
/* Layout follows the original projector page: header + round stepper + standings strip; island cards left, phase panels right. */
#app{max-width:1500px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:1;min-width:280px}
.stepper li{flex:1;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--muted);font-weight:700;font-size:.9rem;border-bottom:3px solid transparent;white-space:nowrap}
.stepper li.done{color:var(--text)}
.stepper li.now{background:var(--surface-2);color:var(--text);border-bottom-color:var(--sun)}
.roundtag{font-family:var(--display);font-weight:800;font-size:1.3rem}
.joinbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--surface);border-radius:16px;padding:12px 16px;margin-top:12px}
.joinbar .qr img{background:#fff;padding:8px;border-radius:10px;display:block;image-rendering:pixelated}
.joinbar .code{font-family:var(--display);font-size:2.6rem;font-weight:800;letter-spacing:.12em;color:var(--sun);line-height:1}
.joinbar .url{font-size:1.05rem}
.joinbar .joined{margin-left:auto;font-weight:700}
.standings{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:12px 0;padding:0}
.standings li{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:5px 14px 5px 10px;font-weight:700}
.standings .rk{color:var(--muted);font-size:.85rem}
.standings b{font-family:var(--display);font-size:1.1rem}
.board{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:16px;align-items:start}
@media (max-width:960px){.board{grid-template-columns:1fr}}
.islands{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.isle{background:var(--surface);border-radius:16px;border-top:6px solid var(--c);padding:14px;display:flex;flex-direction:column;gap:10px}
.isle header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.isle h3{font-size:1.25rem;font-weight:800}
.pts{color:var(--muted);font-size:.9rem;white-space:nowrap}
.pts b{font-family:var(--display);font-size:1.7rem;color:var(--text)}
.isle .team{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media (max-width:960px){.side{position:static}}
.actionrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actionrow{flex-direction:column;align-items:stretch}
.actionrow .btn.primary{font-size:1.05rem}
.err{color:var(--bad);font-weight:700}
.timer.locked{color:var(--coral);font-size:2.8rem}
.side .tboard .board-list{max-height:45vh;overflow-y:auto}
.endgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.endgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var ICON={food:'🐟',water:'💧',wood:'🪵',stone:'🪨',coins:'🪙'};
var LABEL={food:'Food',water:'Water',wood:'Wood',stone:'Stone',coins:'Coins'};
var KEYS=['food','water','wood','stone','coins'];
var PHASES=['Event','Production','Market','Settle up'];
var PNAME={boat:'Fishing boat',well:'Well',hut:'Sturdy hut',lighthouse:'Lighthouse'};
var params=new URLSearchParams(location.search), code=(params.get('c')||'').toUpperCase();
var app=document.getElementById('app'), V=null, offset=0, err='', cache='', lanBase=null;
var isLocal=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if(isLocal){ fetch('/api/lan').then(function(r){return r.json();}).then(function(j){ if(j.addresses&&j.addresses.length){ lanBase='http://'+j.addresses[0]+':'+(location.port||80); cache=''; render(); } }).catch(function(){}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function items(l){ return l.map(function(x){return x.q+ICON[x.r];}).join(' + '); }
function tok(){ try{return localStorage.getItem('castaway-host-'+code);}catch(e){return null;} }
function post(path,body){
  return fetch('/api/g/'+code+'/teacher/'+path,{method:'POST',headers:{'Content-Type':'application/json','x-token':tok()||''},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Error'); return j; });})
    .then(function(){ err=''; }).catch(function(e){ err=e.message; render(true); });
}
function timerLeft(){ if(!V) return 0; return V.timer.running?Math.max(0,Math.ceil((V.timer.endsAt-(Date.now()+offset))/1000)):V.timer.left; }
function mmss(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function primary(){
  var v=V;
  if(v.over) return null;
  if(v.phase===0) return v.event?{label:'Collect production',a:'advance'}:{label:'Reveal the event',a:'reveal'};
  if(v.phase===1) return {label:'Open the market',a:'advance'};
  if(v.phase===2) return {label:'Close the market',a:'advance'};
  if(!v.settled) return {label:'Pay needs',a:'settle'};
  return {label:v.round>=v.rounds?'Finish the game':'Next round',a:'advance'};
}
function islandHTML(f,k){
  var needs=V.needs||{}, showNeeds=!V.over&&V.phase>=1&&!(V.phase===3&&V.settled);
  var inv=KEYS.map(function(r){ var short=showNeeds&&f.inv[r]<(needs[r]||0); return '<div class="inv-i '+r+(short?' short':'')+'"><span class="ic">'+ICON[r]+'</span><b class="num">'+f.inv[r]+'</b><small>'+LABEL[r]+'</small></div>'; }).join('');
  var made=KEYS.filter(function(r){return f.prod[r]>0;}).map(function(r){return f.prod[r]+ICON[r];}).join(' ');
  var badges=Object.keys(f.built||{}).filter(function(p){return f.built[p];}).map(function(p){return '<span class="badge">'+esc(PNAME[p]||p)+'</span>';});
  if(f.feasts) badges.push('<span class="badge">Feast &times;'+f.feasts+'</span>');
  var status='';
  if(showNeeds){
    var miss=KEYS.filter(function(r){return f.inv[r]<(needs[r]||0);}).map(function(r){return ((needs[r]||0)-f.inv[r])+ICON[r];});
    status=miss.length?'<div class="status bad">Still short: '+miss.join(' ')+'</div>':'<div class="status ok">All needs covered</div>';
  }
  if(V.phase===3&&V.settled&&f.last){
    var ks=Object.keys(f.last.short||{});
    status=ks.length?'<div class="status bad">Went without '+ks.map(function(r){return f.last.short[r]+ICON[r];}).join(' ')+' &middot; '+f.last.delta+' pts</div>':'<div class="status ok">All needs met &middot; +'+f.last.delta+' pts</div>';
  }
  var cl=V.islands[k].claimed;
  return '<article class="isle" style="--c:'+esc(f.color)+'"><header><h3>'+esc(f.name)+'</h3><div class="pts"><b class="num">'+f.pts+'</b> pts</div></header>'+
    '<div class="inv">'+inv+'</div>'+
    '<div class="line">Makes each round: '+made+'</div>'+status+
    (badges.length?'<div class="badges">'+badges.join('')+'</div>':'')+
    '<div class="team">'+(cl?'<span class="badge ok">Team joined</span><button class="btn small" data-rel="'+k+'">Release</button>':'<span class="badge">Waiting for a team</span>')+'</div></article>';
}
function standingsHTML(v){
  var order=v.islands.slice().sort(function(a,b){return b.pts-a.pts;});
  return '<ol class="standings" aria-label="Standings">'+order.map(function(i,k){return '<li><span class="dot" style="--c:'+esc(i.color)+'"></span><span class="rk">'+(k+1)+'</span>'+esc(i.name)+' <b class="num">'+i.pts+'</b></li>';}).join('')+'</ol>';
}
function timerClass(l){ return 'timer'+(V.locked?' locked':(l<=30&&V.timer.running?' low':'')); }
function render(force){
  if(!V) return;
  var v=V, pr=primary();
  var base=lanBase||location.origin, joinUrl=base+v.joinPath, qr='';
  try{ var q=qrcode(0,'M'); q.addData(joinUrl); q.make(); qr=q.createImgTag(4,0); }catch(e){}
  var joined=v.islands.filter(function(i){return i.claimed;}).length;
  var action='<div class="actionrow">'+(pr?'<button class="btn primary big" data-p="'+pr.a+'">'+pr.label+' &rarr;</button>':'')+(err?'<span class="err" role="alert">'+esc(err)+'</span>':'')+'</div>';
  var panels='', market='', tradeBoard='';
  if(v.phase===2&&!v.over){
    /* market phase: event card is hidden; trade board first, then the timer */
  } else if(v.event&&!v.over){
    panels+='<section class="panel ev"><h2>Round '+v.round+': what happened?</h2><div class="evcard"><span class="term">'+esc(v.event.term)+'</span><h3>'+esc(v.event.title)+'</h3><p>'+esc(v.event.text)+'</p></div>'+
      '<div class="ask"><b>Ask the class</b>'+esc(v.event.ask)+'</div>'+
      (v.event.notes.length?'<ul class="notes">'+v.event.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>':'')+action+'</section>';
  } else if(!v.over){
    panels+='<section class="panel"><h2>Round '+v.round+': what happened?</h2><p class="muted">Ask the class what could go wrong or right this round, then draw the card.</p>'+action+'</section>';
  }
  if(v.phase===2&&!v.over){
    var l=timerLeft();
    market='<section class="panel"><h2>The market is open</h2><div class="'+timerClass(l)+'" id="timer" role="timer" aria-live="off">'+(v.locked?'Market closed':mmss(l))+'</div>'+
      '<div class="trow"><button class="btn" data-t="'+(v.timer.running?'pause':'start')+'">'+(v.timer.running?'Pause':(v.locked?'Restart (+30s)':'Start timer'))+'</button><button class="btn small" data-t="add" data-s="-30">&minus;30s</button><button class="btn small" data-t="add" data-s="30">+30s</button><button class="btn small" data-t="reset">Reset</button></div>'+
      '<p class="muted" style="text-align:center;font-size:.9rem">When the timer hits zero the market locks and offers can no longer be accepted. '+v.pending+' offer'+(v.pending===1?'':'s')+' waiting.</p>'+action+'</section>';
  }
  if(!v.over&&(v.phase>=2||v.board.length)){
    var cards=v.board.length?v.board.map(function(t,i){return '<li class="deal-card'+(i===0?' newest':'')+'"><div class="dc-isl"><span class="dot" style="--c:'+esc(t.aColor)+'"></span> '+esc(t.a)+' <span aria-hidden="true">&#8644;</span> <span class="dot" style="--c:'+esc(t.bColor)+'"></span> '+esc(t.b)+'</div><div class="dc-items">'+items(t.aItems)+' <span aria-hidden="true">&#8594;</span> '+esc(t.b)+' &nbsp;|&nbsp; '+items(t.bItems)+' <span aria-hidden="true">&#8594;</span> '+esc(t.a)+'</div>'+(i===0&&v.undoable?'<button class="btn small" data-undo="1">Undo</button>':'')+'</li>';}).join(''):'<li class="muted board-empty">No trades yet. Teams send offers from their phones.</li>';
    tradeBoard='<section class="panel tboard"><h3>Trade board <span class="count">'+v.board.length+' deal'+(v.board.length===1?'':'s')+' this round</span></h3><ul class="board-list">'+cards+'</ul>'+(v.locked&&v.phase===2?'<p class="locked-note">&#128274; The timer has run out. New trades are not accepted.</p>':'')+'</section>';
  }
  panels+=tradeBoard+market;
  if(!v.over&&v.phase===3&&v.settled){
    var bc=v.buys.length?v.buys.map(function(b,i){return '<li class="deal-card'+(i===0?' newest':'')+'"><div class="dc-isl"><span class="dot" style="--c:'+esc(b.color)+'"></span> '+esc(b.island)+'</div><div class="dc-items">bought the <b>'+esc(b.project)+'</b></div></li>';}).join(''):'<li class="muted board-empty">No purchases yet. Teams buy from their phones.</li>';
    panels+='<section class="panel tboard"><h3>Purchases <span class="count">'+v.buys.length+' this round</span></h3><ul class="board-list">'+bc+'</ul></section>';
  }
  var body;
  if(v.over&&v.scores){
    var w=v.scores[0], tie=v.scores[1]&&v.scores[1].total===w.total&&v.scores[1].coins===w.coins;
    var rows=v.scores.map(function(s,i){return '<tr><td>'+(i+1)+'. <span style="color:'+esc(s.color)+'">&#9679;</span> '+esc(s.name)+'</td><td class="num">'+s.pts+'</td><td class="num">'+s.coins+' &rarr; +'+s.bonus+'</td><td class="num"><b>'+s.total+'</b></td></tr>';}).join('');
    body='<div style="display:flex;flex-direction:column;gap:16px;margin-top:16px"><div><p class="muted" style="margin:0 0 4px">Final scores after '+v.rounds+' rounds</p><div class="winner">'+(tie?'It is a tie at the top: <span>'+v.scores.filter(function(s){return s.total===w.total&&s.coins===w.coins;}).map(function(s){return esc(s.name);}).join(' and ')+'</span>':'<span>'+esc(w.name)+'</span> wins with '+w.total+' points')+'</div></div>'+
      '<section class="panel"><h2>Final scores</h2><div class="tablewrap"><table><tr><th scope="col">Island</th><th scope="col">Points</th><th scope="col">Coins to bonus</th><th scope="col">Total</th></tr>'+rows+'</table></div><p class="muted" style="font-size:.85rem">Every '+v.constants.coinsPerPoint+' coins left over is worth 1 bonus point.</p></section>'+
      '<section class="islands" aria-label="Islands">'+v.full.map(islandHTML).join('')+'</section></div>';
  } else {
    body=standingsHTML(v)+'<main class="board"><section class="islands" aria-label="Islands">'+v.full.map(islandHTML).join('')+'</section><aside class="side">'+panels+'</aside></main>';
  }
  var steps=PHASES.map(function(p,i){var cls=v.over||i<v.phase?'done':i===v.phase?'now':''; return '<li class="'+cls+'"'+(i===v.phase&&!v.over?' aria-current="step"':'')+'>'+(i+1)+' '+p+'</li>';}).join('');
  var html='<header class="top"><h1>Castaway Economy</h1><ol class="stepper">'+steps+'</ol><div class="roundtag">'+(v.over?'Game over':'Round '+v.round+' of '+v.rounds)+'</div></header>'+
    '<div class="joinbar"><div class="qr">'+qr+'</div><div><div class="muted">Students go to <b class="url">'+esc(base.replace(/^https?:\/\//,''))+'/play</b> and enter</div><div class="code">'+esc(v.code)+'</div></div><div class="joined">'+joined+' of '+v.islands.length+' teams joined</div></div>'+body;
  if(force||html!==cache){ app.innerHTML=html; cache=html; }
  tick();
}
function tick(){
  var el=document.getElementById('timer'); if(!el||!V||V.phase!==2) return;
  var l=timerLeft(); el.textContent=V.locked?'Market closed':mmss(l); el.className=timerClass(l);
}
app.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.p) return post(b.dataset.p);
  if(b.dataset.t){ var o={op:b.dataset.t}; if(b.dataset.s) o.s=+b.dataset.s; return post('timer',o); }
  if(b.dataset.undo) return post('undo');
  if(b.dataset.rel){ if(confirm('Release this island so another device can join it?')) post('release',{idx:+b.dataset.rel}); }
});
function connect(){
  var es=new EventSource('/api/g/'+code+'/stream?token='+encodeURIComponent(tok()||''));
  es.onmessage=function(m){ V=JSON.parse(m.data); offset=V.serverNow-Date.now(); render(); };
  es.onerror=function(){ fetch('/api/g/'+code+'/state?token='+encodeURIComponent(tok()||'')).then(function(r){ if(r.status===401||r.status===404){ es.close(); app.innerHTML='<div class="panel" style="max-width:560px;margin:40px auto"><h1>Game not found</h1><p>This game code is not on this computer or has ended.</p><p><a href="/">Back to start</a></p></div>'; } }).catch(function(){}); };
}
setInterval(tick,250);
if(!code||!tok()) location.href='/'; else connect();
})();
</script>
</body>
</html>
